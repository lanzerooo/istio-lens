[package]
name = "istio-lens"
version = "0.1.0"
edition = "2024"

[dependencies]
# Async Runtime
tokio = { version = "1.37", features = ["full"] }
tokio-stream = "0.1"

# Kubernetes & Istio
kube = { version = "0.88", features = ["client", "runtime", "derive"] }
k8s-openapi = { version = "0.21", features = ["latest"] }
schemars = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }

# Graph Engine
petgraph = "0.6"

# TUI & Terminal
ratatui = "0.26"
crossterm = { version = "0.27", features = ["event-stream"] }

# Utilities & Error Handling
thiserror = "1.0"
anyhow = "1.0"
itertools = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true